<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>歐洲旅人護照</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow passport column; cover is warm parchment like a passport page. 大面積用柔橘 #E8A54F，品牌橘 #F39500 只留在小點綴。 */
/* 色彩取自永信旅遊官網：主橘 #F39500、導覽深藍 #00223D、底灰 #F5F5F5、米白 #F9F6EF */
:root{
  --bg:#EFE7D8; --page:#FBF7EF; --ink:#2B2B33; --muted:#665F53; --line:#E2D7C2;
  --cover:#F7F1E5; --cover-ink:#1E3A5C; --cover-line:#E2D6BE; --brand:#F39500; --accent:#E8A54F; --on-accent:#1E3A5C; --cta-edge:#C98A3E; --cta-glow:rgba(232,165,79,.32); --accent-soft:#FBEEDC; --pin:#1E3A5C;
  --stamp:#2F4C6E; --sea:#DCE6EE; --land:#F7F1E5; --land-off:#E8E1D3; --border:#C4B8A2; --v1:#F1D9AE; --v2:#E3A55A; --v3:#A8692C; --v-ink:#4A2E0F;
  --east:#EBDDC3; --west:#FDE3B5; --south:#FAEFC8; --north:#D6E1EC;
  --f-display:"LXGW WenKai TC","Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",serif;
  --f-body:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1620; --page:#15212D; --ink:#E9EEF3; --muted:#9AA7B4; --line:#283543;
  --cover:#22303D; --cover-ink:#F3EEE4; --cover-line:#3A4756; --brand:#F39500; --accent:#E3A457; --on-accent:#1E2A36; --cta-edge:#9C6A2E; --cta-glow:rgba(0,0,0,.35); --accent-soft:#3A2D1C; --pin:#0D1620;
  --stamp:#9DBBDA; --sea:#0F1C29; --land:#22303E; --land-off:#1A2531; --border:#3A4A5B; --v1:#5A4628; --v2:#B8823F; --v3:#F0C27E; --v-ink:#1A1206;
  --east:#3B3427; --west:#4A3A1E; --south:#45401F; --north:#24384C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1620; --page:#15212D; --ink:#E9EEF3; --muted:#9AA7B4; --line:#283543;
  --cover:#22303D; --cover-ink:#F3EEE4; --cover-line:#3A4756; --brand:#F39500; --accent:#E3A457; --on-accent:#1E2A36; --cta-edge:#9C6A2E; --cta-glow:rgba(0,0,0,.35); --accent-soft:#3A2D1C; --pin:#0D1620;
  --stamp:#9DBBDA; --sea:#0F1C29; --land:#22303E; --land-off:#1A2531; --border:#3A4A5B; --v1:#5A4628; --v2:#B8823F; --v3:#F0C27E; --v-ink:#1A1206;
  --east:#3B3427; --west:#4A3A1E; --south:#45401F; --north:#24384C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.page{background:var(--page);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;background:var(--accent);color:var(--on-accent);font-size:16px;
  box-shadow:0 4px 0 var(--cta-edge),0 8px 18px var(--cta-glow);transition:transform .15s ease,box-shadow .15s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--cta-edge),0 12px 24px var(--cta-glow)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cta-edge),0 3px 8px var(--cta-glow)}
.btn.ghost{background:var(--page);color:var(--ink);border:1.5px solid var(--border);font-weight:600;box-shadow:0 3px 0 var(--line)}
.btn.ghost:hover{box-shadow:0 5px 0 var(--line),0 8px 16px rgba(0,0,0,.06)}
.btn.cta{font-size:17px;padding:16px 18px;animation:floaty 2.8s ease-in-out infinite}
.btn.cta:hover,.btn.cta:active{animation-play-state:paused}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -4px}}
.help{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
.dock{position:sticky;bottom:0;z-index:3;display:flex;flex-direction:column;gap:6px;margin:0 -16px;padding:22px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 38%)}
.replay{background:none;border:0;color:var(--muted);font-size:12.5px;text-decoration:underline;align-self:center;padding:0}
/* ===== 開場動畫 ===== */
.intro{position:relative;height:min(78vh,600px);min-height:480px;border-radius:16px;overflow:hidden;background:var(--cover);border:1px solid var(--cover-line);color:var(--cover-ink)}
.intro .skip{position:absolute;top:12px;right:12px;z-index:5;background:color-mix(in srgb,var(--page) 80%,transparent);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink)}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:24px 22px 34px;gap:10px;text-align:center}
.sc .cap{font-family:var(--f-display);font-size:20px;line-height:1.5;max-width:320px;position:relative;z-index:2;background:color-mix(in srgb,var(--cover) 88%,transparent);border-radius:12px;padding:6px 12px}
.sc .cap small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);margin-top:4px}
.s1{animation:scene 2.6s ease forwards}
.s2{opacity:0;animation:scene 2.6s ease 2.5s forwards}
.s3{opacity:0;justify-content:center;animation:fadein .9s ease 5s forwards}
@keyframes scene{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes fadein{to{opacity:1}}
.ground{position:absolute;left:0;right:0;bottom:150px;height:2px;background:var(--cover-line)}
.rab{position:absolute;bottom:150px;left:0;width:150px;animation:run 2.4s linear forwards}
.rab svg{width:100%;height:auto;display:block;animation:hop .3s ease-in-out infinite alternate}
@keyframes run{from{transform:translateX(380px)}to{transform:translateX(-170px)}}
@keyframes hop{to{transform:translateY(-8px) rotate(-3deg)}}
.bubble{position:absolute;top:22%;left:50%;transform:translateX(-50%);background:var(--page);border:1.5px solid var(--border);border-radius:14px;padding:8px 14px;font-weight:700;color:var(--ink);animation:pop .4s ease .5s both}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.tunnel{position:absolute;inset:0;display:grid;place-items:center}
.tunnel i{position:absolute;border-radius:50%;border:2px solid var(--cover-line);width:60px;height:60px;animation:ring 1.6s linear infinite}
.tunnel i:nth-child(2){animation-delay:.4s}.tunnel i:nth-child(3){animation-delay:.8s}.tunnel i:nth-child(4){animation-delay:1.2s}
@keyframes ring{from{transform:scale(.2);opacity:0}30%{opacity:1}to{transform:scale(9);opacity:0}}
.fall{position:absolute;bottom:-60px;width:44px;animation:rise 2.4s linear 2.5s both}
.fall svg{width:100%;height:auto;display:block}
@keyframes rise{from{transform:translateY(0) rotate(0)}to{transform:translateY(-640px) rotate(320deg)}}
.grin{position:absolute;top:16%;right:12%;width:90px;opacity:0;animation:grin 2s ease 3s both}
@keyframes grin{0%{opacity:0}40%{opacity:.9}100%{opacity:0}}
.imap{width:100%;max-width:330px}.imap svg{width:100%;height:auto;display:block}
.imap path{fill:var(--land-off);stroke:var(--border);stroke-width:.8;opacity:0;animation:fadein .6s ease forwards}
.istamp{opacity:0;transform-box:fill-box;transform-origin:center;animation:stamp .35s cubic-bezier(.3,1.6,.6,1) forwards}
@keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(-20deg)}to{opacity:.9;transform:scale(1) rotate(-8deg)}}
.dots3{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots3 i{width:7px;height:7px;border-radius:50%;background:var(--cover-line)}
.dots3 i:nth-child(1){animation:dot 2.5s step-end 0s forwards}.dots3 i:nth-child(2){animation:dot 2.5s step-end 2.5s forwards}.dots3 i:nth-child(3){animation:dotOn .1s 5s forwards}
@keyframes dot{0%{background:var(--brand)}100%{background:var(--cover-line)}} @keyframes dotOn{to{background:var(--brand)}}
@media (prefers-reduced-motion: reduce){
 .btn.cta{animation:none}.s1,.s2{display:none}.s3{opacity:1;animation:none}.imap path,.istamp{opacity:1;animation:none}.dots3{display:none}}
.btn:disabled{opacity:.45;cursor:default}
.note{font-size:12.5px;color:var(--muted)}
/* cover */
.cover{background:var(--cover);color:var(--cover-ink);border:1px solid var(--cover-line);border-radius:16px;padding:30px 24px 26px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.cover .seal{width:86px;height:86px;border-radius:50%;border:2px solid var(--brand);display:grid;place-items:center;color:var(--brand);font-family:var(--f-display);font-size:13px;text-align:center;line-height:1.3;transform:rotate(-10deg);align-self:flex-end;margin-bottom:-56px}
.cover h1{font-size:30px;letter-spacing:.06em}
.cover .sub{font-family:var(--f-display);font-size:20px}
.cover .meta{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;opacity:.85}
.cover .btn{align-self:stretch}
.cover .note{color:var(--cover-ink);opacity:.75}
/* quiz */
.progress{display:flex;gap:6px}
.progress span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress span.on{background:var(--brand)}
.qhead{display:flex;justify-content:space-between;align-items:center}
.qnum{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.qtitle{font-size:22px;line-height:1.35}
.qsub{font-size:13.5px;color:var(--muted);margin-top:-10px}
.vig{margin:-6px -4px 0;border-radius:12px;overflow:hidden}.vig svg{display:block;width:100%;height:auto}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vig{opacity:.82}} :root[data-theme="dark"] .vig{opacity:.82}
.pp-head{display:flex;gap:14px;align-items:center}.pp-head .av{width:88px;flex:none}.pp-head .av svg{width:100%;height:auto;display:block}
.pp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pp-stats div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}.pp-stats b{display:block;font-family:var(--f-mono);font-size:20px}.pp-stats span{font-size:12px;color:var(--muted)}
.mapbox path.c1{fill:var(--v1)} .mapbox path.c2{fill:var(--v2)} .mapbox path.c3{fill:var(--v3)}
.mapbox path.next{stroke:var(--stamp);stroke-width:2;stroke-dasharray:5 4}
.mapbox .cnt circle{fill:var(--page);stroke:var(--v3);stroke-width:3}.mapbox .cnt circle.o{fill:none;stroke-width:1.5}
.mapbox .cnt text{font-family:var(--f-mono);font-size:22px;font-weight:700;fill:var(--v-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mapbox .cnt text{fill:var(--ink)}} :root[data-theme="dark"] .mapbox .cnt text{fill:var(--ink)}
.vlegend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.vlegend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:4px;vertical-align:-2px;border:1px solid var(--border)}
.vlegend .badge{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:2px solid var(--v3);font-family:var(--f-mono);font-size:10px;font-weight:700;margin-right:4px;color:var(--ink)}
.flt{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:12px;padding:12px}
.flt .fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.flt .fh b{font-size:14px}
.flt .fg{display:grid;grid-template-columns:118px 1fr;gap:6px;align-items:start}
.flt .fg>span{font-size:12px;color:var(--muted);padding-top:6px}
.flt .fc{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1.5px solid var(--border);background:var(--page);border-radius:999px;padding:5px 11px;font-size:13px}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.fchip[aria-pressed="true"]::before{content:"✓ "}
.fcount{font-size:12.5px;color:var(--muted)}.fclear{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:0}
.empty{font-size:13.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:12px}
.trips{display:flex;flex-direction:column;gap:6px;font-size:13.5px}.trips div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:6px}.trips span:first-child{font-family:var(--f-mono);color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--page);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:15px}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px;min-width:16px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.back{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 0}
/* result */
.visa{border:2px dashed var(--stamp);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;position:relative;background:var(--page)}
.visa .stamp{position:absolute;top:14px;right:14px;border:2px solid var(--stamp);color:var(--stamp);border-radius:8px;padding:2px 8px;font-family:var(--f-mono);font-size:12px;transform:rotate(6deg)}
.visa h2{font-size:30px;letter-spacing:.04em}
.vhead{display:flex;gap:14px;align-items:center}
.vhead .av{width:96px;height:96px;flex:none}
.vhead .av svg,.tiers svg,.trio svg{width:100%;height:auto;display:block}
.alias{font-size:14px;color:var(--muted)}
.avtoggle{background:none;border:0;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:0;align-self:flex-start}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:12px;color:var(--muted)}
.tiers div{display:flex;flex-direction:column;gap:2px;align-items:center}
.tiers .now{color:var(--ink);font-weight:700}
.trio{display:flex;gap:8px;flex-wrap:wrap}.trio div{width:54px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;opacity:.9}
.visa .pace{font-size:13px;color:var(--muted)}
.visa .desc{font-size:15px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:76px 1fr 38px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--stamp);border-radius:4px}
.bar.top .fill{background:var(--accent)}
.bar .v{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--page);border-radius:999px;padding:7px 14px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-h h3{font-size:19px}
.tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.cards{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--page)}
.card .t{font-weight:700;font-size:15.5px}
.card .m{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.card .why{font-size:13.5px}
.card .price{font-family:var(--f-mono);font-size:13px;color:var(--ink)}
.card button{align-self:flex-start;margin-top:4px;padding:8px 14px;font-size:14px}
/* map：真實歐洲國界（Natural Earth 1:50m，方位等積投影） */
.mapbox{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--sea);position:relative}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox path{fill:var(--land-off);stroke:var(--border);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .15s}
.mapbox path.on{cursor:pointer}
.mapbox path.north{fill:var(--north)} .mapbox path.west{fill:var(--west)} .mapbox path.east{fill:var(--east)} .mapbox path.south{fill:var(--south)}
.mapbox path.in{fill:var(--accent);stroke:var(--on-accent);stroke-width:1}
.mapbox path.pick{fill:var(--accent);stroke:var(--stamp);stroke-width:2.2}
.mapbox path.on:hover{stroke:var(--stamp);stroke-width:1.4}
.mapbox path:focus{outline:none}
.mapbox path:focus-visible{stroke:var(--stamp);stroke-width:2.6}
.mapbox .pin{pointer-events:none}
.mapbox .pin rect{fill:var(--pin)} .mapbox .pin text{fill:#fff;font-size:28px;font-weight:700;font-family:var(--f-body)}
.mapbox .lbl{pointer-events:none;font-size:15px;fill:var(--muted);font-family:var(--f-body)}
.mapbox .hint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--page) 85%,transparent);padding:2px 8px;border-radius:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--border)}
.info{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:10px 12px;font-size:13.5px;min-height:46px;display:flex;flex-direction:column;gap:6px}
.info b{font-size:15px}
.cats{display:flex;flex-direction:column;gap:8px}
.cats .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cats .grp span{font-size:12px;color:var(--muted);width:32px}
.cat{border:1px solid var(--line);background:var(--page);border-radius:999px;padding:4px 10px;font-size:12.5px}
.cat[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.cat.rec::after{content:" ★";color:var(--accent)}
.cat.rec[aria-pressed="true"]::after{color:var(--on-accent)}
.rlist{display:flex;flex-direction:column;gap:4px}
.rlist button{text-align:left;background:var(--page);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.rlist button span:last-child{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
/* feedback */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{border:1.5px solid var(--line);background:var(--page);border-radius:10px;padding:10px 0;font-family:var(--f-mono);font-size:16px}
.scale button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.scale-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--page);color:var(--ink);font:inherit}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--page);padding:10px 16px;border-radius:10px;font-size:13.5px;max-width:calc(100% - 32px);z-index:5}
.foot{text-align:center;font-size:12px;color:var(--muted)}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px}

/* ===== 計分與推薦 =====
   節奏（tempo 題）＋取向（orient 題）各自加總成比例；
   角色分數＝節奏 × 取向，五個角色加總為 100%：
   白兔＝精準×經典、紅心皇后＝精準×深度、柴郡貓＝留白×深度、瘋帽匠＝留白×經典、愛麗絲＝均衡；
   「放鬆／隨意」取向平分給同節奏的兩個角色。 */
function axes(){const t={precise:0,balanced:0,slow:0},o={classic:0,depth:0,free:0};
  QUESTIONS.forEach(q=>{if(q.k!=='tempo'&&q.k!=='orient')return;const a=state.ans[q.id];if(a==null)return;
    const w=q.o[a][1],tg=q.k==='tempo'?t:o;for(const k in w)tg[k]+=w[k]});
  const norm=x=>{const sum=Object.values(x).reduce((a,b)=>a+b,0),r={};for(const k in x)r[k]=sum?x[k]/sum:1/3;return r};
  return {t:norm(t),o:norm(o)}}
function scores(){const {t,o}=axes(),h=o.free/2;
  return {rabbit:t.precise*(o.classic+h),queen:t.precise*(o.depth+h),cat:t.slow*(o.depth+h),hatter:t.slow*(o.classic+h),alice:t.balanced}}
const TIE=['alice','rabbit','cat','queen','hatter'];
function topPace(sh){return Object.keys(sh).sort((a,b)=>(Math.abs(sh[b]-sh[a])>1e-9?sh[b]-sh[a]:0)||TIE.indexOf(a)-TIE.indexOf(b))[0]}
const ADJ={precise:['balanced'],balanced:['precise','slow'],slow:['balanced']};
function scoreAll(role){const pace=PACES[role].tempo;
  const interest=Q('q6').o[state.ans.q6]?.[0]; const b=state.ans.q10; const avoid=new Set((state.ans.q12||[]).map(i=>Q('q12').o[i][0]));
  return TRIPS.map(t=>{let s=0,why=[];
    if(t.pace===pace){s+=3;why.push(TEMPO_NAME[pace])}else if(ADJ[pace].includes(t.pace))s+=1;
    if(interest&&t.tags.includes(interest)){s+=2;why.push(interest)}
    if(b===5||b==null)s+=1;else if(t.band===b){s+=2;why.push('符合預算')}else if(Math.abs(t.band-b)===1)s+=.5;else s-=1;
    if(avoid.has('每天換飯店')&&t.stay){s+=1;why.push('連泊不換飯店')} if(avoid.has('每天換飯店')&&!t.stay)s-=.5;
    if(avoid.has('拉車時間太久')&&t.drive)s-=1.5; if(avoid.has('自由時間太少')&&t.pace==='precise')s-=1.5;
    return {t,s,why}}).sort((a,b)=>b.s-a.s)}
function recommend(pace){return scoreAll(pace).slice(0,3)}

/* ===== 結果頁篩選：來自親和圖的四項核心需求 ===== */
function filterDefs(p){
  const interest=Q('q6').o[state.ans.q6]?.[0], b=state.ans.q10, bl=b!=null&&b<4?['8 萬','10 萬','13 萬','16 萬'].at(b):null;
  const F=[
   {id:'free', g:'不被安排',        label:'自由時間多',     test:t=>t.pace!=='precise'},
   {id:'stay', g:'不被安排',        label:'連泊不換飯店',   test:t=>!!t.stay},
   {id:'same', g:'跟同頻的人出遊',  label:'同節奏的人同團', test:t=>t.pace===PACES[p].tempo},
   {id:'theme',g:'快速找到對應商品',label:interest?`只看${interest}`:null, test:t=>t.tags.includes(interest)},
   {id:'short',g:'快速找到對應商品',label:'10 天內',        test:t=>t.days<=10},
   {id:'budget',g:'避開不適合的行程',label:bl?`${bl}以內`:null, test:t=>t.band<=b},
   {id:'drive',g:'避開不適合的行程',label:'少拉車',          test:t=>!t.drive}];
  return F.filter(f=>f.label)}
const GROUPS=['不被安排','跟同頻的人出遊','快速找到對應商品','避開不適合的行程'];

    cards.querySelectorAll('button').forEach(b=>b.onclick=()=>{const r=list[+b.dataset.k];log('rec_click',{trip:r.t.name,rank:+b.dataset.k,pace:state.view,filters:on});toast('謝謝！這是課程原型，實際服務上線後會由顧問與你聯繫。')});
    flt.querySelectorAll('.fchip').forEach(b=>b.onclick=()=>{const f=b.dataset.f;state.filters.has(f)?state.filters.delete(f):state.filters.add(f);log('filter',{id:f,on:state.filters.has(f)});draw()});
    const c=flt.querySelector('#fclear');if(c)c.onclick=()=>{state.filters.clear();log('filter',{id:'clear'});draw()};
  }
  draw();
  el.querySelector('#share').onclick=async()=>{const text=`我是「${P.name}」！你是哪一種歐洲旅人？1 分鐘測驗：${location.href.split('#')[0]}`;log('share',{pace:p});
    try{if(navigator.share){await navigator.share({text});return}}catch(e){}
    try{await navigator.clipboard.writeText(text);toast('已複製分享文字，可以貼到 LINE 或 IG')}catch(e){toast('請截圖角色卡分享給朋友')}};
  el.querySelector('#avt').onclick=()=>{state.showAv=!state.showAv;try{localStorage.setItem('hideAvatar',state.showAv?'0':'1')}catch(e){};log('avatar_toggle',{show:state.showAv});render()};
  el.querySelector('#pp').onclick=()=>{log('passport_preview',{});state.screen='passport';render()};
  el.querySelector('#next').onclick=()=>{state.screen='feedback';state.extraIdx=-1;render()};
  return el}


/* ===== 歐洲探索地圖 ===== */
const price=g=>g.p?(g.p[0]===g.p[1]?`約 ${(g.p[0]/1e4).toFixed(1)} 萬元`:`約 ${(g.p[0]/1e4).toFixed(1)}–${(g.p[1]/1e4).toFixed(1)} 萬元`):'官網標示請電洽';
function mapUI(el,first){
  const box=el.querySelector('#map'),info=el.querySelector('#info'),cats=el.querySelector('#cats');
  if(!state.mapSel)state.mapSel={type:'region',id:first};
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 800 760');svg.setAttribute('role','img');svg.setAttribute('aria-label','歐洲地圖');
  const paths={};
  GEO.forEach(g=>{const p=document.createElementNS(ns,'path');p.setAttribute('d',g.d);
    const home=HOME[g.c];if(home){p.classList.add(home,'on');p.setAttribute('tabindex','0');p.setAttribute('aria-label',CNAME[g.c]);
      const go=()=>{state.mapSel={type:'country',cc:g.c};log('map_click',{country:g.c});paint()};
      p.addEventListener('click',go);p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})}
    (paths[g.c]=paths[g.c]||[]).push(p);svg.append(p)});
  const pin=document.createElementNS(ns,'g');pin.setAttribute('class','pin');svg.append(pin);
  box.innerHTML='';box.append(svg);
  const hint=document.createElement('span');hint.className='hint';hint.textContent='點國家看行程';box.append(hint);
  const centroid=cc=>{const g=GEO.find(x=>x.c===cc);return g?[g.x,g.y]:[400,400]};
  function drawPin(x,y,label){pin.innerHTML='';const w=label.length*28+24;
    pin.innerHTML=`<rect x="${x-w/2}" y="${y-54}" width="${w}" height="42" rx="9"/><path d="M${x-8} ${y-13}L${x} ${y-2}L${x+8} ${y-13}Z" fill="var(--pin)"/><text x="${x}" y="${y-23}" text-anchor="middle">${label}</text>`}
  function paint(){
    Object.values(paths).flat().forEach(p=>p.classList.remove('in','pick'));
    const sel=state.mapSel;
    if(sel.type==='region'){const g=REGIONS.find(r=>r.id===sel.id);
      g.cc.forEach(c=>(paths[c]||[]).forEach(p=>p.classList.add('in')));
      const [x,y]=PIN[g.id]||centroid(g.cc[0]);drawPin(x,y,g.id===first?'第一站':g.full.split('・')[0].replace(/（.*）/,''));
      info.innerHTML=`<b>${AREA_NAME[g.area]}｜${g.full}${g.id===first?'　★ 推薦第一站':''}</b><span>官網行程 ${g.d} 天，${price(g)}</span><span class="note">涵蓋國家：${g.cc.map(c=>CNAME[c]).join('、')}</span>`;
    } else {const cc=sel.cc;(paths[cc]||[]).forEach(p=>p.classList.add('pick'));
      const [x,y]=centroid(cc);drawPin(x,y,CNAME[cc]);
      const rs=REGIONS.filter(r=>r.cc.includes(cc));
      info.innerHTML=`<b>${CNAME[cc]}｜永信有 ${rs.length} 個分類會去這裡</b><div class="rlist">${rs.map(r=>`<button data-id="${r.id}"><span>${r.full}</span><span>${r.d} 天・${price(r)}</span></button>`).join('')}</div>`;
      info.querySelectorAll('.rlist button').forEach(b=>b.onclick=()=>{state.mapSel={type:'region',id:b.dataset.id};log('map_click',{region:b.dataset.id});paint()});
    }
    cats.querySelectorAll('.cat').forEach(b=>b.setAttribute('aria-pressed',sel.type==='region'&&b.dataset.id===sel.id));
  }
  cats.innerHTML=['north','west','east','south'].map(a=>`<div class="grp"><span>${AREA_NAME[a]}</span>${REGIONS.filter(r=>r.area===a).map(r=>`<button class="cat${r.id===first?' rec':''}" data-id="${r.id}">${r.full.replace(/（.*）/,'')}</button>`).join('')}</div>`).join('');
  cats.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{state.mapSel={type:'region',id:b.dataset.id};log('map_click',{region:b.dataset.id});paint()});
  paint();
}

/* ===== 旅人護照足跡頁（老客示意資料） ===== */
const DEMO_TRIPS=[{id:'at-cz',d:'2022.05'},{id:'at-cz-hu',d:'2023.10'},{id:'de-ch',d:'2024.07'},{id:'germany',d:'2025.04'},{id:'italy',d:'2025.10'}];
function passport(){
  const p=state.view||'rabbit',P=PACES[p];
  const cnt={},via={};DEMO_TRIPS.forEach(t=>{const r=REGIONS.find(x=>x.id===t.id);r.cc.forEach(c=>{cnt[c]=(cnt[c]||0)+1;(via[c]=via[c]||[]).push(t)})});
  const lit=new Set(DEMO_TRIPS.map(t=>t.id)).size, next=REGIONS.find(r=>r.id==='spain');
  const el=$(`<section class="screen" style="display:flex;flex-direction:column;gap:16px">
   <div class="page"><div class="pp-head"><div class="av">${av(P.ch,'gold')}</div><div><p class="eyebrow">我的歐洲旅人護照（示意）</p><h2 style="font-size:24px">${P.name}</h2><span class="alias">${P.alias}・金等級</span></div></div>
    <div class="pp-stats"><div><b>${DEMO_TRIPS.length}</b><span>出團次數</span></div><div><b>${Object.keys(cnt).length}</b><span>去過的國家</span></div><div><b>${lit}/23</b><span>點亮的分類</span></div></div></div>
   <div class="page"><div class="section-h"><h3>足跡地圖</h3><span class="tag">顏色越深＝去越多次</span></div>
    <div class="mapbox" id="fmap"></div>
    <div class="vlegend"><span><i style="background:var(--land-off)"></i>未造訪</span><span><i style="background:var(--v1)"></i>1 次</span><span><i style="background:var(--v2)"></i>2 次</span><span><i style="background:var(--v3)"></i>3 次以上</span><span><span class="badge">3</span>圓章＝確切次數</span><span><i style="background:transparent;border:2px dashed var(--stamp)"></i>下一站推薦</span></div>
    <div class="info" id="finfo"></div></div>
   <div class="page"><div class="section-h"><h3>郵戳紀錄</h3><span class="tag">依出團時間</span></div>
    <div class="trips">${DEMO_TRIPS.slice().reverse().map(t=>`<div><span>${t.d}</span><span>${REGIONS.find(r=>r.id===t.id).full}</span></div>`).join('')}</div></div>
   <button class="btn ghost" id="back2">回到我的結果</button>
  </section>`);
  const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 800 760');svg.setAttribute('role','img');svg.setAttribute('aria-label','足跡地圖');
  const info=el.querySelector('#finfo');
  const show=cc=>{const n=cnt[cc]||0;
    info.innerHTML=n?`<b>${CNAME[cc]}｜去過 ${n} 次</b><span>${via[cc].map(t=>t.d+' '+REGIONS.find(r=>r.id===t.id).full).join('<br>')}</span>`
      :(next.cc.includes(cc)?`<b>${CNAME[cc]}｜還沒去過・下一站推薦</b><span>${next.full}，${next.d} 天，${price(next)}</span>`:`<b>${CNAME[cc]||'這裡'}｜還沒去過</b><span>點亮它，地圖就會多一塊顏色。</span>`);
    log('footprint_click',{country:cc,count:n})};
  GEO.forEach(g=>{const p=document.createElementNS(ns,'path');p.setAttribute('d',g.d);const n=cnt[g.c]||0;
    if(n)p.classList.add('c'+Math.min(n,3));if(next.cc.includes(g.c)&&!n)p.classList.add('next');
    if(HOME[g.c]){p.classList.add('on');p.addEventListener('click',()=>show(g.c))}svg.append(p)});
  Object.entries(cnt).filter(([c,n])=>n>=2).forEach(([c,n])=>{const g=GEO.find(x=>x.c===c);if(!g)return;
    const k=document.createElementNS(ns,'g');k.setAttribute('class','cnt');
    k.innerHTML=`<circle cx="${g.x}" cy="${g.y}" r="19"/><circle class="o" cx="${g.x}" cy="${g.y}" r="24"/><text x="${g.x}" y="${g.y+8}" text-anchor="middle">${n}</text>`;svg.append(k)});
  el.querySelector('#fmap').append(svg);
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  info.innerHTML=`<b>最常去：${CNAME[top[0]]}（${top[1]} 次）</b><span>點地圖上的國家，看每一次的出團紀錄；虛線框是還沒點亮的下一站推薦。</span>`;
  el.querySelector('#back2').onclick=()=>{if(location.hash==='#passport')history.replaceState(null,'',location.pathname+location.search);state.screen=state.pace?'result':'cover';render()};
  return el}

const EXTRA=[
 {id:'e1',t:'你的年齡與身分？',o:['學生','上班族 20–30 歲','上班族 31–40 歲','其他']},
 {id:'e2',t:'未來兩年有去歐洲的打算嗎？',o:['有計畫','有興趣，還沒計畫','沒有']},
 {id:'e3',t:'如果同一團每天能自己選節奏，你跟團的意願會？',o:['提高','沒有影響','降低']},
 {id:'e4',t:'你能接受旅行社 LINE 多久傳一次訊息？',o:['每週','每月 2–3 次','每月 1 次','更少','希望不要主動傳']},
 {id:'e5',t:'如果旅程中有選填的收藏印章，你覺得？',o:['會想收集','看情況','覺得麻煩']}
];
function feedback(){const k=state.extraIdx;
  if(k===-1){const el=$(`<section class="screen page">
     <p class="eyebrow">回饋 1 / 2</p><h2 class="qtitle">這個推薦符合你嗎？</h2>
     <div class="scale">${[1,2,3,4,5].map(n=>`<button data-n="${n}" aria-pressed="${state.fit===n}">${n}</button>`).join('')}</div>
     <div class="scale-l"><span>完全不符合</span><span>非常符合</span></div><p class="help">點一個數字就會進到下一步</p></section>`);
    el.querySelectorAll('.scale button').forEach(b=>b.onclick=()=>{state.fit=+b.dataset.n;log('fit',{score:state.fit,pace:state.view});state.extraIdx=0;render()});return el}
  if(k<EXTRA.length){const q=EXTRA[k];const el=$(`<section class="screen page">
     <div class="qhead"><span class="eyebrow">回饋 2 / 2・幫我們一個小忙</span><span class="qnum">${k+1} / ${EXTRA.length}</span></div>
     <h2 class="qtitle">${q.t}</h2>
     <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span>${o}</span></button>`).join('')}</div>
     <button class="back" id="skip">略過其餘問題</button></section>`);
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{state.extra[q.id]=+b.dataset.i;log('extra',{q:q.id,a:+b.dataset.i});state.extraIdx++;render()});
    el.querySelector('#skip').onclick=()=>{state.extraIdx=EXTRA.length;render()};return el}
  const el=$(`<section class="screen page">
     <h2 class="qtitle">願意花 10 分鐘聊聊你的旅遊規劃嗎？</h2>
     <p class="note">選填。留下 LINE ID 或 Email，我們會邀請你參加線上訪談；聯絡方式只用於這次邀請。</p>
     <label for="contact" class="note">LINE ID 或 Email</label>
     <input type="text" id="contact" autocomplete="off">
     <div class="row"><button class="btn" id="send">送出</button><button class="btn ghost" id="no">不用了，謝謝</button></div></section>`);
  el.querySelector('#send').onclick=()=>{const v=el.querySelector('#contact').value.trim();if(v)log('interview_optin',{contact:v});state.screen='thanks';render()};
  el.querySelector('#no').onclick=()=>{state.screen='thanks';render()};return el}

function thanks(){const P=PACES[state.view];const el=$(`<section class="screen cover">
   <div class="seal">完成<br>入境</div>
   <h1 style="font-size:26px;padding-right:84px">謝謝你，${P.name}</h1>
   <p>你的回答會幫助我們設計更好的旅程推薦。可以把角色卡分享給朋友，看看他們是哪一種旅人。</p>
   <button class="btn cta" id="again">回到我的結果 →</button>
   <p class="note">輔大創新創業社課程原型・作答匿名</p></section>`);
  el.querySelector('#again').onclick=()=>{state.screen='result';render()};return el}

/* ===== 統計頁（網址加上 #stats） ===== */
function statsView(){const el=$(`<section class="screen" style="display:flex;flex-direction:column;gap:16px">
  <div class="page"><p class="eyebrow">原型數據</p><h2 style="font-size:24px">測驗統計</h2><p class="note" id="st-src">讀取中…</p></div>
  <div id="st-body" style="display:flex;flex-direction:column;gap:16px"></div></section>`);
  loadEvents().then(ev=>{const body=el.querySelector('#st-body');const s=el.querySelector('#st-src');
    if(!ev){s.textContent='尚未連接資料來源：部署後在 ENDPOINT 填入 Apps Script 網址，或以可編輯身分開啟此頁。';return}
    s.textContent=`共 ${new Set(ev.map(e=>e.sid)).size} 位訪客、${ev.length} 筆事件`;
    const by=n=>ev.filter(e=>e.ev===n);const uniq=n=>new Set(by(n).map(e=>e.sid)).size;
    const views=uniq('page_view'),start=uniq('quiz_start'),done=uniq('quiz_complete'),rec=uniq('rec_click'),share=uniq('share'),mapc=uniq('map_click'),sw=uniq('switch_pace');
    const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
    const fits=by('fit').map(e=>JSON.parse(e.data).score);const fitAvg=fits.length?(fits.reduce((a,b)=>a+b,0)/fits.length).toFixed(1):'—';
    body.append($(`<div class="kpis">
      <div class="kpi"><div class="n">${pct(done,start)}</div><div class="l">測驗完成率（${done}/${start}）</div></div>
      <div class="kpi"><div class="n">${fitAvg}</div><div class="l">推薦符合度（1–5，${fits.length} 人）</div></div>
      <div class="kpi"><div class="n">${pct(share,done)}</div><div class="l">角色卡分享率</div></div>
      <div class="kpi"><div class="n">${pct(sw,done)}</div><div class="l">按過「換個節奏」</div></div></div>`));
    const funnel=[['進入頁面',views],['開始測驗',start],['完成測驗',done],['點地圖區域',mapc],['點推薦行程',rec],['分享角色卡',share]];
    body.append(barBlock('轉換漏斗（人數）',funnel,Math.max(1,views)));
    const pc=Object.fromEntries(ROLE_ORDER.map(k=>[k,0]));by('quiz_complete').forEach(e=>{const d=JSON.parse(e.data),r=d.role||d.pace;if(r in pc)pc[r]++});
    body.append(barBlock('角色分布',Object.entries(pc).map(([k,v])=>[PACES[k].name,v]),Math.max(1,done)));
    const ans=k=>by('quiz_complete').map(e=>JSON.parse(e.data).ans[k]);
    const cnt=(k,opts)=>opts.map((o,i)=>[o[0],ans(k).filter(a=>a===i).length]);
    body.append(barBlock('預算分布（Q10）',cnt('q10',Q('q10').o),Math.max(1,done)));
    body.append(barBlock('想看的主題（Q6）',cnt('q6',Q('q6').o),Math.max(1,done)));
    body.append(barBlock('最想帶回什麼（Q5）',cnt('q5',Q('q5').o),Math.max(1,done)));
    body.append(barBlock('想去的餐廳（Q9）',cnt('q9',Q('q9').o),Math.max(1,done)));
    const avd=Q('q12').o.map((o,i)=>[o[0],ans('q12').filter(a=>(a||[]).includes(i)).length]);
    body.append(barBlock('最不想遇到（Q12，可複選）',avd,Math.max(1,done)));
    EXTRA.forEach(q=>{const a=by('extra').map(e=>JSON.parse(e.data)).filter(d=>d.q===q.id);
      body.append(barBlock(q.t,q.o.map((o,i)=>[o,a.filter(d=>d.a===i).length]),Math.max(1,a.length)))});
    const src={};by('page_view').forEach(e=>src[e.src]=(src[e.src]||0)+1);
    body.append(barBlock('來源',Object.entries(src),Math.max(1,views)));
  });return el}
function barBlock(title,rows,max){return $(`<div class="page"><h3 style="font-size:17px">${title}</h3><div class="bars">${rows.map(([l,v])=>`<div class="hbar"><span>${l}</span><div class="track"><div class="fill" style="width:${Math.round(v/max*100)}%"></div></div><span class="v">${v}</span></div>`).join('')}</div></div>`)}
async function loadEvents(){
  if(ENDPOINT){try{const r=await fetch(ENDPOINT+'?action=list');const j=await r.json();if(Array.isArray(j))return j}catch(e){}}
  if(dbRef){try{const q=await dbRef.collection('events').get();return q.docs.map(d=>d.data())}catch(e){}}
  return null}

window.addEventListener('hashchange',render);
render();
</script>
</body></html>
